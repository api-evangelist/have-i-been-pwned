aid: have-i-been-pwned
name: Have I Been Pwned
description: Have I Been Pwned (HIBP) is a free service operated by Troy Hunt that lets individuals and
  organizations check whether their email addresses, phone numbers, passwords, or domains have appeared
  in known data breaches, pastes, or stealer logs. The service aggregates billions of compromised records
  and exposes both free and paid endpoints, including the k-anonymity Pwned Passwords API. The v3 REST
  API at haveibeenpwned.com requires an hibp-api-key header for breach, paste, domain, and stealer log
  endpoints and is offered across Core, Pro, and High RPM subscription tiers.
